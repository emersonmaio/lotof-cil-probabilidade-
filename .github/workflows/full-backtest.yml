name: full-8plus2-backtest
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository history (single source of truth)
        run: python -c "import sys; sys.path.insert(0,'src'); from data_io import load_history; r=load_history('data/lotofacil.csv'); print('OK', len(r), 'concursos')"
      - name: Run 20 seeds x 3 windows on the repository history
        run: |
          mkdir -p results
          python src/backtest_8plus2.py --csv data/lotofacil.csv --out results/smoke.csv --start 500 --window 100
          python src/multi_backtest_8plus2.py --csv data/lotofacil.csv --out results/multi.csv --start 500 --seeds 20 --windows 50,100,200
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: lotofacil-8plus2-results
          path: results/*.csv
