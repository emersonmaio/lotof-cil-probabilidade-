name: smoke-test
on:
  workflow_dispatch:
  push:
    paths: ["src/**","data/**","results/**"]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile src/backtest_8plus2.py
