name: Lotofacil backtest
on:
  workflow_dispatch:
  push:
    paths: ["src/**","data/**","results/**",".github/workflows/backtest.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Validar base historica
        run: |
          python - <<'PY'
          import csv
          rows=[]
          with open("data/lotofacil.csv", encoding="utf-8-sig", newline="") as f:
              rows=list(csv.reader(f))
          assert len(rows) > 1, "base historica vazia"
          ids=[int(r[0]) for r in rows[1:]]
          assert ids == list(range(1, ids[-1] + 1)), "IDs dos concursos nao estao completos ou ordenados"
          for i, r in enumerate(rows[1:], start=1):
              assert len(r) >= 17, f"linha {i}: colunas insuficientes"
              nums=[int(x) for x in r[2:17]]
              assert len(nums)==15 and len(set(nums))==15 and all(1<=x<=25 for x in nums), f"concurso {r[0]}: dezenas invalidas"
          print(f"Base validada: {len(ids)} concursos, IDs 1-{ids[-1]}, 15 dezenas validas por concurso.")
          PY
      - name: Validar Python
        run: python -m py_compile src/experiment.py
      - name: Executar teste completo
        run: python src/experiment.py --csv data/lotofacil.csv --out results --window 100
      - uses: actions/upload-artifact@v4
        with:
          name: lotofacil-resultados
          path: results/
