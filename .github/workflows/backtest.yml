name: Lotofacil backtest
on:
  workflow_dispatch:
  push:
    paths: ["src/**","data/**","results/**",".github/workflows/backtest.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Baixar e montar base historica
        run: |
          python - <<'PY'
          import csv
          import urllib.request
          from pathlib import Path

          url = "https://loteriaplus.com.br/lotofacil/estatisticas/download"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          raw = urllib.request.urlopen(req, timeout=30).read().decode("utf-8-sig")
          print("Download recebido:", len(raw), "bytes")
          print(raw[:300])

          rows = list(csv.reader(raw.splitlines()))
          assert rows, "CSV vazio"

          # Aceita tanto o formato normalizado quanto o formato com dezenas agrupadas.
          header = ["concurso","data"] + [f"d{i}" for i in range(1,16)]
          data = {}
          for r in rows[1:]:
              if not r or not r[0].strip().isdigit():
                  continue
              c = int(r[0])
              if c > 3791:
                  continue
              if len(r) >= 17:
                  nums = r[2:17]
              elif len(r) >= 3:
                  nums = r[2].replace(",", " ").split()
              else:
                  continue
              if len(nums) == 15:
                  data[c] = [str(c), r[1] if len(r) > 1 else ""] + [f"{int(x):02d}" for x in nums]

          assert len(data) == 3791, f"base incompleta: {len(data)}"
          assert sorted(data) == list(range(1,3792))

          out = Path("data/lotofacil.csv")
          out.parent.mkdir(parents=True, exist_ok=True)
          with out.open("w", encoding="utf-8", newline="") as f:
              w = csv.writer(f, lineterminator="\n")
              w.writerow(header)
              w.writerows(data[c] for c in range(1,3792))
          print("Base pronta:", len(data), "concursos")
          PY
      - name: Validar Python
        run: python -m py_compile src/experiment.py
      - name: Executar teste completo
        run: python src/experiment.py --csv data/lotofacil.csv --out results --window 100
      - uses: actions/upload-artifact@v4
        with:
          name: lotofacil-resultados
          path: results/
