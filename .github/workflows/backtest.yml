name: Lotofacil backtest
on:
  workflow_dispatch:
  push:
    paths: ["src/**","data/**","results/**",".github/workflows/backtest.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: heldersontuc-collab/lotofacil-data
          ref: 7d288088caaaa7aaa4888dcf397ac36ab3eb74fe
          path: source-data
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Montar base historica 1-3791
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          src = Path("source-data/data/lotofacil.csv")
          out = Path("data/lotofacil.csv")
          out.parent.mkdir(parents=True, exist_ok=True)

          with src.open("r", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.reader(f))

          header = rows[0]
          data = {}
          for r in rows[1:]:
              if r and r[0].strip().isdigit():
                  data[int(r[0])] = r

          assert max(data) == 3789, f"snapshot inesperado: {max(data)}"
          assert len(data) == 3789, f"faltam/duplicados no snapshot: {len(data)}"

          data[3790] = ["3790","27/09/2026","01","03","04","05","06","07","09","11","14","15","16","17","20","21","25"]
          data[3791] = ["3791","28/09/2026","01","02","04","06","08","09","11","12","13","14","15","16","19","24","25"]

          ordered = [data[i] for i in range(1,3792)]
          assert len(ordered) == 3791
          assert [int(r[0]) for r in ordered] == list(range(1,3792))

          with out.open("w", encoding="utf-8", newline="") as f:
              w = csv.writer(f, lineterminator="\n")
              w.writerow(header)
              w.writerows(ordered)

          print("Base pronta:", len(ordered), "concursos; ultimo:", ordered[-1][0])
          PY
      - name: Validar Python
        run: python -m py_compile src/experiment.py
      - name: Executar teste completo
        run: python src/experiment.py --csv data/lotofacil.csv --out results --window 100
      - uses: actions/upload-artifact@v4
        with:
          name: lotofacil-resultados
          path: results/
