name: Freeze prospective Lotofacil portfolio

on:
  workflow_dispatch:
  push:
    paths:
      - "src/freeze_portfolio.py"
      - "data/lotofacil.csv"
      - ".github/workflows/freeze-portfolio.yml"

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate frozen portfolio using only past contests
        run: python src/freeze_portfolio.py --csv data/lotofacil.csv --target 3808 --out results/frozen --seed 20261019 --candidates 300
      - name: Upload immutable pre-draw record
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-concurso-3808-congelado
          path: results/frozen/concurso_3808_congelado.json
          if-no-files-found: error
