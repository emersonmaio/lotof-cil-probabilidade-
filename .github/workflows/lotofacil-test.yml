name: Lotofacil - teste completo

on:
  workflow_dispatch:
    inputs:
      window:
        description: "Janela historica para frequencia/recencia"
        required: true
        default: "100"
  push:
    paths:
      - "src/**"
      - "data/**"
      - ".github/workflows/lotofacil-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restaurar base historica
        run: |
          mkdir -p data
          curl -fsSL "https://raw.githubusercontent.com/heldersontuc-collab/lotofacil-data/7d288088caaaa7aaa4888dcf397ac36ab3eb74fe/data/lotofacil.csv" -o data/lotofacil.csv

          # O snapshot publico acima vai ate o concurso 3788.
          # Os concursos 3789-3791 sao anexados para reproduzir exatamente
          # a base usada neste experimento (arquivo recebido em 29/09/2026).
          cat >> data/lotofacil.csv <<'EOF'
3789,25/09/2026,06,07,08,09,11,12,13,14,15,16,17,18,19,23,25
3790,27/09/2026,01,03,04,05,06,07,09,11,14,15,16,17,20,21,25
3791,28/09/2026,01,02,04,06,08,09,11,12,13,14,15,16,19,24,25
EOF

          test "$(tail -n +2 data/lotofacil.csv | wc -l)" -eq 3791
          test "$(tail -n 1 data/lotofacil.csv | cut -d, -f1)" -eq 3791
          wc -l data/lotofacil.csv
          tail -n 5 data/lotofacil.csv
      - name: Executar validacao e holdout
        run: |
          python src/experiment.py --csv data/lotofacil.csv --out results --window ${{ inputs.window || '100' }}
      - name: Publicar resultados
        uses: actions/upload-artifact@v4
        with:
          name: lotofacil-resultados
          path: results/
