name: Lotofacil teste

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar base
        run: curl -fsSL "https://raw.githubusercontent.com/heldersontuc-collab/lotofacil-data/7d288088caaaa7aaa4888dcf397ac36ab3eb74fe/data/lotofacil.csv" -o data/lotofacil.csv
      - name: Completar concursos 3789-3791
        run: |
          cat >> data/lotofacil.csv <<'EOF'
3789,25/09/2026,06,07,08,09,11,12,13,14,15,16,17,18,19,23,25
3790,27/09/2026,01,03,04,05,06,07,09,11,14,15,16,17,20,21,25
3791,28/09/2026,01,02,04,06,08,09,11,12,13,14,15,16,19,24,25
EOF
      - name: Validar base
        run: |
          test "$(tail -n +2 data/lotofacil.csv | wc -l)" -eq 3791
          test "$(tail -n 1 data/lotofacil.csv | cut -d, -f1)" -eq 3791
      - name: Rodar experimento
        run: python src/experiment.py --csv data/lotofacil.csv --out results --window 100
      - uses: actions/upload-artifact@v4
        with:
          name: lotofacil-resultados
          path: results/
