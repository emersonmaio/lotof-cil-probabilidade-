name: Lotofacil - teste completo

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "data/**"
      - ".github/workflows/lotofacil-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restaurar base historica
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          curl -fsSL "https://raw.githubusercontent.com/heldersontuc-collab/lotofacil-data/7d288088caaaa7aaa4888dcf397ac36ab3eb74fe/data/lotofacil.csv" -o data/lotofacil.csv
          cat >> data/lotofacil.csv <<'EOF'
3789,25/09/2026,06,07,08,09,11,12,13,14,15,16,17,18,19,23,25
3790,27/09/2026,01,03,04,05,06,07,09,11,14,15,16,17,20,21,25
3791,28/09/2026,01,02,04,06,08,09,11,12,13,14,15,16,19,24,25
EOF
          rows=$(tail -n +2 data/lotofacil.csv | wc -l)
          last=$(tail -n 1 data/lotofacil.csv | cut -d, -f1)
          echo "Linhas de dados: $rows"
          echo "Ultimo concurso: $last"
          test "$rows" -eq 3791
          test "$last" -eq 3791
          python - <<'PY'
import csv
p="data/lotofacil.csv"
with open(p, newline="", encoding="utf-8") as f:
    rows=list(csv.reader(f))
assert len(rows)-1 == 3791
assert rows[0][0].lower() == "concurso"
ids=[int(r[0]) for r in rows[1:]]
assert ids == list(range(1,3792))
for r in rows[1:]:
    nums=[int(x) for x in r[2:17]]
    assert len(nums)==15 and len(set(nums))==15 and all(1<=x<=25 for x in nums)
print("Base validada: 3791 concursos, 15 dezenas validas por concurso.")
PY
      - name: Executar validacao e holdout
        shell: bash
        run: |
          set -euo pipefail
          python src/experiment.py --csv data/lotofacil.csv --out results --window 100
      - name: Publicar resultados
        uses: actions/upload-artifact@v4
        with:
          name: lotofacil-resultados
          path: results/
